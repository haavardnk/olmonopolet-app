name: beermonopoly
description: An app to find good beers on Vinmonopolet
publish_to: "none"
version: 2.2.6+146

environment:
  flutter: ">=3.47.0"
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  adaptive_theme: ^3.8.0
  cached_network_image: ^4.0.2
  cronet_http: ^1.9.0
  cupertino_http: ^3.1.0
  cupertino_icons: ^1.0.9
  equatable: ^3.0.0
  fetch_client: ^1.2.1
  flag: ^7.0.2
  crypto: ^3.0.7
  firebase_analytics: ^12.6.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  app_badge_plus: ^1.3.5
  flutter_dotenv: ^6.0.1
  firebase_messaging: ^16.7.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  flutter:
    sdk: flutter
  flutter_fadein: ^2.0.0
  flutter_local_notifications: ^22.3.1
  geolocator: ^14.1.1
  go_router: ^18.0.2
  http: ^1.6.0
  infinite_scroll_pagination: ^5.1.1
  intl: ^0.20.3
  provider: ^6.1.5+1
  rate_my_app: ^2.4.2
  retry: ^3.1.2
  rotated_corner_decoration: ^2.1.0+1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  url_launcher: ^6.3.2
  path: ^1.9.1
  flutter_screenutil: ^5.9.3
  share_plus: ^13.3.0
  animated_reorderable_list: ^1.3.0
  mobile_scanner: ^7.4.2
  material_ui: ^1.5.0
  cupertino_ui: ^1.1.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  flutter_lints: ^6.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "dev_assets/icon/icon.png"
  adaptive_icon_background: "#FFA100"
  adaptive_icon_foreground: "dev_assets/icon/icon_adaptive.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
  - assets/images/placeholder.png
  - assets/images/default_avatar.png
  - assets/images/logo_transparent.png
  - .env
